name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["Casks/**", "**.md"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Cache Swift packages
        uses: actions/cache@v6
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build
        run: swift build

      - name: Test
        run: ./scripts/test.sh

      - name: Build app bundle
        run: ./scripts/build-app.sh

      # Fails the build if the app costs more than 0.1% of a core or refreshes more
      # than twice a minute while idle. See docs/PERFORMANCE.md.
      - name: Idle performance budget
        run: ./scripts/perf.sh build/EtherDot.app 120

      - name: Upload app
        uses: actions/upload-artifact@v7
        with:
          name: EtherDot-app
          path: build/EtherDot.app
          retention-days: 7
